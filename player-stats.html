<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stats des joueuses - Soccer U13F-D1 Lévis Est</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --card: #121212;
        --ink: #ffffff;
        --muted: #b7b7b7;
        --accent: #39ff14;
        --accent-2: #39ff14;
        --line: #1f1f1f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Alegreya", "Georgia", serif;
        color: var(--ink);
        background-color: var(--bg);
        background-image:
          linear-gradient(180deg, rgba(10, 10, 10, 0.88), rgba(10, 10, 10, 0.9)),
          url("https://images.pexels.com/photos/10347875/pexels-photo-10347875.jpeg?cs=srgb&dl=pexels-140938577-10347875.jpg&fm=jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
      }

      header {
        padding: 32px 20px 12px;
        text-align: center;
        position: relative;
      }

      header h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: 0.5px;
      }

      header p {
        margin: 8px 0 0;
        color: var(--muted);
      }

      .header-icon {
        position: absolute;
        top: 18px;
        right: 20px;
        font-size: 1.8rem;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 10px 20px 60px;
      }


      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      }



      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 1rem;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 8px 12px;
        font-weight: 700;
        background: var(--accent);
        color: #0a0a0a;
        cursor: pointer;
      }

      button.secondary {
        background: #1b1b1b;
        color: var(--ink);
      }


      th,
      td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
      }

      th {
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 700px) {
        table {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Statistiques des joueuses</h1>
      <div class="header-icon" aria-hidden="true">🐢</div>
      <p>Soccer U13F-D1 Lévis Est</p>
      <p>
        <a href="stats-history.html">Voir stats + historique</a>
        | <button id="refreshStats" type="button" class="secondary">Rafraichir</button>
      </p>
    </header>
    <main>
      <section class="card">
        <table>
          <thead>
            <tr>
              <th data-sort="name">Joueuse</th>
              <th data-sort="goals">Buts</th>
              <th data-sort="assists">Passes</th>
              <th data-sort="fullMatches">Matchs complets</th>
              <th data-sort="stars">Étoiles</th>
              <th data-sort="juggle">Jonglerie</th>
            </tr>
          </thead>
          <tbody id="playersTable"></tbody>
        </table>
        <p id="emptyState" class="muted"></p>
      </section>
    </main>

    <script>
      const STORAGE_KEY = "soccer_stats_v1";
      const playersTable = document.getElementById("playersTable");
      const playersHeader = document.querySelector("thead");
      const refreshStats = document.getElementById("refreshStats");
      const emptyState = document.getElementById("emptyState");

      const normalizePlayer = (player) => {
        if (typeof player === "string") {
          return { name: player, number: "", juggle: "" };
        }
        return {
          name: typeof player.name === "string" ? player.name : "",
          number: typeof player.number === "string" ? player.number : "",
          juggle: typeof player.juggle === "string" ? player.juggle : ""
        };
      };

      const loadState = () => {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { matches: [], players: [] };
        try {
          const parsed = JSON.parse(raw);
          return {
            matches: Array.isArray(parsed.matches) ? parsed.matches : [],
            players: Array.isArray(parsed.players)
              ? parsed.players.map(normalizePlayer).filter((player) => player.name)
              : []
          };
        } catch {
          return { matches: [], players: [] };
        }
      };

      let state = loadState();

      let sortKey = "goals";
      let sortAsc = false;


      const buildPlayerStats = () => {
        const playerStats = new Map();

        const ensurePlayer = (name) => {
          if (!playerStats.has(name)) {
            playerStats.set(name, {
              name,
              games: new Set(),
              goals: 0,
              assists: 0,
              fullMatches: 0,
              stars: 0
            });
          }
          return playerStats.get(name);
        };

        const juggleMap = new Map();
        state.players.forEach((player) => {
          if (player && player.name) {
            ensurePlayer(player.name);
            if (player.juggle) {
              juggleMap.set(player.name, player.juggle);
            }
          }
        });

        state.matches.forEach((match, index) => {
          const matchId = match.date || `${match.opponent}-${index}`;
          const fullMatchPlayers = Array.isArray(match.fullMatchPlayers)
            ? match.fullMatchPlayers
            : [];
          fullMatchPlayers.forEach((name) => {
            const player = ensurePlayer(name);
            player.games.add(matchId);
            player.fullMatches += 1;
          });
          const goals = Array.isArray(match.goals) ? match.goals : [];

          const stars = Array.isArray(match.stars) ? match.stars : [];
          stars.forEach((name) => {
            const player = ensurePlayer(name);
            player.stars += 1;
          });

          goals.forEach((goal) => {
            if (goal.scorer) {
              const scorer = ensurePlayer(goal.scorer);
              scorer.goals += 1;
              scorer.games.add(matchId);
            }
            if (goal.assist) {
              const assist = ensurePlayer(goal.assist);
              assist.assists += 1;
              assist.games.add(matchId);
            }
          });
        });

        return Array.from(playerStats.values()).map((player) => ({
          ...player,
          juggle: juggleMap.get(player.name) || "-"
        })).sort((a, b) => {
          if (sortKey === "name") {
            const cmp = a.name.localeCompare(b.name, "fr", { sensitivity: "base" });
            return sortAsc ? cmp : -cmp;
          }
          const aVal = Number(a[sortKey] || 0);
          const bVal = Number(b[sortKey] || 0);
          if (aVal !== bVal) return sortAsc ? aVal - bVal : bVal - aVal;
          const nameCmp = a.name.localeCompare(b.name, "fr", { sensitivity: "base" });
          return sortAsc ? nameCmp : -nameCmp;
        });
      };

      const renderPlayerStats = () => {
        playersTable.innerHTML = "";
        const rows = buildPlayerStats();

        if (rows.length === 0) {
          emptyState.textContent = "Aucune statistique disponible pour le moment.";
          return;
        }
        emptyState.textContent = "";

        rows.forEach((player) => {
          const tr = document.createElement("tr");

          const nameTd = document.createElement("td");
          nameTd.textContent = player.name;

          const goalsTd = document.createElement("td");
          goalsTd.textContent = player.goals;

          const assistsTd = document.createElement("td");
          assistsTd.textContent = player.assists;

          const fullMatchesTd = document.createElement("td");
          fullMatchesTd.textContent = player.fullMatches;

          const starsTd = document.createElement("td");
          starsTd.textContent = player.stars;

          const juggleTd = document.createElement("td");
          juggleTd.textContent = player.juggle;

          tr.appendChild(nameTd);
          tr.appendChild(goalsTd);
          tr.appendChild(assistsTd);
          tr.appendChild(fullMatchesTd);
          tr.appendChild(starsTd);
          tr.appendChild(juggleTd);

          playersTable.appendChild(tr);
        });
      };



      window.addEventListener("storage", (event) => {
        if (event.key !== STORAGE_KEY) return;
        state = loadState();
        renderPlayerStats();
      });

      const reloadStateAndRender = () => {
        state = loadState();
        renderPlayerStats();
      };

      refreshStats.addEventListener("click", () => {
        reloadStateAndRender();
      });

      playersHeader.addEventListener("click", (event) => {
        const target = event.target.closest("th");
        if (!target || !target.dataset.sort) return;
        const nextKey = target.dataset.sort;
        if (sortKey === nextKey) {
          sortAsc = !sortAsc;
        } else {
          sortKey = nextKey;
          sortAsc = nextKey === "name";
        }
        renderPlayerStats();
      });

      window.addEventListener("focus", () => {
        reloadStateAndRender();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          reloadStateAndRender();
        }
      });

      renderPlayerStats();
    </script>
  </body>
</html>
